<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CallCoach - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13a4ec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 px-10 py-4 bg-white dark:bg-[#15242b] shadow-sm z-10">
<div class="flex items-center gap-4">
<div class="size-6 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M24 45.8096C19.6865 45.8096 15.4698 44.5305 11.8832 42.134C8.29667 39.7376 5.50128 36.3314 3.85056 32.3462C2.19985 28.361 1.76794 23.9758 2.60947 19.7452C3.451 15.5145 5.52816 11.6284 8.57829 8.5783C11.6284 5.52817 15.5145 3.45101 19.7452 2.60948C23.9758 1.76795 28.361 2.19986 32.3462 3.85057C36.3314 5.50129 39.7376 8.29668 42.134 11.8833C44.5305 15.4698 45.8096 19.6865 45.8096 24L24 24L24 45.8096Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-xl font-bold leading-tight tracking-[-0.015em] text-slate-900 dark:text-white">CallCoach</h2>
</div>
</header>
<main class="flex-1 flex items-center justify-center p-4 relative overflow-hidden bg-gradient-to-br from-background-light to-slate-100 dark:from-background-dark dark:to-[#0c151a]">
<!-- Decorative background element -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="w-full max-w-[480px] bg-white dark:bg-[#15242b] rounded-xl shadow-xl dark:shadow-2xl dark:shadow-black/50 border border-slate-100 dark:border-slate-800 p-8 flex flex-col gap-6">
<div class="flex flex-col gap-2 text-center pb-2">
<h1 class="text-3xl font-black leading-tight tracking-[-0.033em] text-slate-900 dark:text-white">Welcome Back</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal">Master the art of conversation.</p>
</div>
<div class="flex">
<div class="flex h-12 flex-1 items-center justify-center rounded-lg bg-slate-100 dark:bg-[#0c151a] p-1 border border-slate-200 dark:border-slate-800">
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-md px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#1a2d36] has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-600 dark:text-slate-400 text-sm font-semibold transition-all">
<span class="truncate">Agent</span>
<input checked="" class="invisible w-0 absolute" name="role" type="radio" value="Agent"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-md px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#1a2d36] has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-600 dark:text-slate-400 text-sm font-semibold transition-all">
<span class="truncate">Manager</span>
<input class="invisible w-0 absolute" name="role" type="radio" value="Manager"/>
</label>
</div>
</div>
<form class="flex flex-col gap-5">
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-300 text-sm font-medium">Email Address</span>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">mail</span>
<input class="form-input flex w-full resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#101c22] h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 pl-10 pr-4 text-base transition-colors" placeholder="name@company.com" required="" type="email"/>
</div>
</label>
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-300 text-sm font-medium">Password / Team Code</span>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
<input class="form-input flex w-full resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#101c22] h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 pl-10 pr-4 text-base transition-colors" placeholder="Enter password" required="" type="password"/>
</div>
</label>
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded border-slate-300 dark:border-slate-700 text-primary focus:ring-primary dark:bg-[#101c22]" type="checkbox"/>
<span class="text-sm text-slate-600 dark:text-slate-400">Remember me</span>
</label>
<a class="text-sm text-primary hover:text-primary/80 font-medium transition-colors" href="#">Forgot Password?</a>
</div>
<button class="mt-2 flex h-12 w-full items-center justify-center rounded-lg bg-primary hover:bg-primary/90 text-white text-base font-bold transition-colors shadow-md shadow-primary/20" type="button">
                    Sign In
                </button>
</form>
<div class="text-center pt-4 border-t border-slate-200 dark:border-slate-800">
<p class="text-sm text-slate-500 dark:text-slate-400">
                    Need access? <a class="text-primary hover:underline font-medium" href="#">Request from your admin</a>
</p>
</div>
</div>
</main>
</body></html>
